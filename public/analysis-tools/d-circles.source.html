<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>D-Circles (placeholder)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:var(--bg, #f3f4f6); color:var(--fg,#16181c); margin:0; }
    .tool-root { padding:20px; }
    .hero { background:#fff; border-radius:8px; padding:18px; box-shadow:0 6px 18px rgba(16,24,40,0.06); }
    .circle { width:64px; height:64px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; margin:8px; font-weight:700; color:#fff; }
    .odd { background:var(--odd,#d92d2d); }
    .even { background:var(--even,#2f7dff); }
  </style>
</head>
<body>
  <div class="tool-root">
    <div class="hero">
      <h2>D-Circles (Placeholder)</h2>
      <p>This is a licensed placeholder page for the D-Circles analysis tool. It demonstrates the socket-bridge and styling injection.
      </p>
      <div id="circles" aria-live="polite">
        <div class="circle odd">ODD</div>
        <div class="circle even">EVEN</div>
        <div class="circle odd">ODD</div>
      </div>
    </div>
  </div>
  <script>
    // Demo: listen for messages from parent to show ticks
    window.addEventListener('message', function(e) {
      try{
        var data = e.data;
        if(!data || !data.type) return;
        console.log('tool received', data);
      }catch(err){}
    });

    // Attach a basic WebSocket shim if needed
    (function(){
      if(window.WebSocket) return;
      function FakeSocket(){ this.send=function(){}};
      window.WebSocket = FakeSocket;
    })();
  </script>
</body>
</html>
